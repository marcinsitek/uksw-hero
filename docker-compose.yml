services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uksw-hero-server
    restart: unless-stopped
    environment:
      DATABASE_URL: ${POSTGRES_URL}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - uksw-hero-network
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - uksw-hero-network

networks:
  uksw-hero-network:
    driver: bridge
  
volumes:
  postgres_data:
